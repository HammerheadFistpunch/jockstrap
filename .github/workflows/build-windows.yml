name: Windows desktop build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --onedir --windowed --name Jockstrap --collect-all rasterio --collect-all pyproj --collect-all tkintermapview --collect-all itmlogic --collect-all matplotlib desktop_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: Jockstrap-Windows
          path: dist/Jockstrap/
