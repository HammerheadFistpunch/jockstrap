[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jockstrap-planner"
version = "0.1.0"
description = "Standalone microwave PtMP and PtP network planner"
requires-python = ">=3.11"
license = {text = "GPL-2.0"}
dependencies = ["numpy>=1.24", "rasterio>=1.4", "pyproj>=3.5", "requests>=2.31", "matplotlib>=3.8", "tkintermapview==1.30", "itmlogic>=1.1"]

[project.scripts]
jockstrap = "jockstrap.cli:main"

[tool.setuptools.packages.find]
include = ["jockstrap*"]
